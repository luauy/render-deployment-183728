# nginx reverse-proxy config for Docker Registry
# Replace `registry.example.com` with your domain or IP (use DNS pointing to server IP).

server {
    listen 80;
    server_name registry.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name registry.example.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Basic auth (protect registry access)
    # Basic auth (protect registry access)
    auth_basic "Private Registry";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        proxy_pass http://registry:5000/;
        proxy_set_header Host $http_host; # required for docker client 'Host' header
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 900;
    }
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
    }
}
