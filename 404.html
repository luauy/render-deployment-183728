<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found</title>
  <link rel="stylesheet" href="assets/error.css">
</head>
<body>
  <main class="error-container">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you requested does not exist. If you typed the URL manually, please check it and try again.</p>

    <div class="actions">
      <a class="btn" href="/index.html">Go to Home</a>
      <a class="btn ghost" href="/projects/">View Projects</a>
    </div>

    <form class="search" action="/" method="get" role="search">
      <label for="q">Search the site (simple):</label>
      <input id="q" name="q" placeholder="Search (not implemented)" />
    </form>

    <p class="muted">If you keep seeing this and believe it
 is an error, open an issue in the repo.</p>
  </main>
</body>
</html>
